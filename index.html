<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trái Đất 3D – Ô nhiễm & Giải pháp Khắc phục</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #060a14;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    canvas { display: block; }

    #info-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 360px;
      background: rgba(8, 12, 24, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 22px 24px;
      backdrop-filter: blur(24px);
      z-index: 10;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    #info-panel h1 {
      font-size: 18px;
      font-weight: 650;
      margin-bottom: 10px;
    }
    #info-panel p {
      font-size: 13.5px;
      line-height: 1.6;
      color: rgba(255,255,255,0.78);
    }

    #legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(8, 12, 24, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 18px 22px;
      backdrop-filter: blur(24px);
      z-index: 10;
      font-size: 13px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
      max-width: 340px;
    }
    #legend strong {
      display: block;
      margin-bottom: 10px;
      font-size: 13.5px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 7px 0;
      color: rgba(255,255,255,0.85);
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.red    { background: #ff3b3b; box-shadow: 0 0 12px #ff3b3b; }
    .dot.orange { background: #ff9f1a; box-shadow: 0 0 12px #ff9f1a; }
    .dot.yellow { background: #ffd60a; box-shadow: 0 0 12px #ffd60a; }
    .dot.blue   { background: #00b4d8; box-shadow: 0 0 12px #00b4d8; }
    .dot.green  { background: #00e676; box-shadow: 0 0 12px #00e676; }

    #controls {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    button {
      background: rgba(8, 12, 24, 0.9);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 13.5px;
      cursor: pointer;
      backdrop-filter: blur(20px);
      transition: all 0.22s ease;
      min-width: 150px;
    }
    button:hover {
      background: rgba(255, 60, 60, 0.9);
      border-color: #ff4d4d;
      transform: translateY(-2px);
    }

    /* ===== POPUP với hiệu ứng xoay ===== */
    #popup {
      position: absolute;
      display: none;
      background: rgba(8, 12, 24, 0.96);
      border-radius: 16px;
      padding: 18px 20px;
      max-width: 340px;
      z-index: 20;
      pointer-events: none;
      border: 1px solid;
      backdrop-filter: blur(18px);
      box-shadow: 0 16px 48px rgba(0,0,0,0.55);

      /* Trạng thái ẩn */
      opacity: 0;
      transform: rotateY(-25deg) scale(0.85);
      transform-origin: left center;
      transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Khi hiện */
    #popup.show {
      display: block;
      opacity: 1;
      transform: rotateY(0deg) scale(1);
    }

    #popup h3 {
      font-size: 15.5px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    #popup .problem {
      font-size: 13.2px;
      line-height: 1.5;
      color: rgba(255,255,255,0.9);
      margin-bottom: 10px;
    }
    #popup .solution {
      font-size: 13.2px;
      line-height: 1.5;
      color: #00e676;
      padding-top: 10px;
      border-top: 1px solid rgba(0,230,118,0.25);
    }
    #popup .solution strong {
      color: #00e676;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <div id="info-panel">
      <h1>🌍 Ô nhiễm & Giải pháp Khắc phục</h1>
      <p>Click vào bất kỳ điểm sáng nào để xem <strong>vấn đề ô nhiễm</strong> và <strong>giải pháp khắc phục tương ứng</strong>. Các điểm được phân bố khắp thế giới.</p>
    </div>

    <div id="legend">
      <strong>Chú thích màu sắc</strong>
      <div class="legend-item"><div class="dot red"></div> Ô nhiễm nghiêm trọng</div>
      <div class="legend-item"><div class="dot orange"></div> Ô nhiễm cao</div>
      <div class="legend-item"><div class="dot yellow"></div> Ô nhiễm trung bình</div>
      <div class="legend-item"><div class="dot blue"></div> Hoàng Sa / Trường Sa</div>
      <div class="legend-item"><div class="dot green"></div> Giải pháp thành công</div>
    </div>

    <div id="controls">
      <button id="btn-reset">Đặt lại góc nhìn</button>
    </div>

    <div id="popup">
      <h3 id="popup-title"></h3>
      <div class="problem" id="popup-problem"></div>
      <div class="solution" id="popup-solution"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060a14);

    // Stars
    const starsGeo = new THREE.BufferGeometry();
    const starCount = 4000;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 2200;
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({
      color: 0xffffff, size: 1.3, transparent: true, opacity: 0.8
    })));

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0.3, 0.35, 3.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.55;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 1.7;
    controls.maxDistance = 6.5;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 0;

    // Lights
    scene.add(new THREE.AmbientLight(0x445066, 0.95));
    const sunLight = new THREE.DirectionalLight(0xfff5e8, 2.35);
    sunLight.position.set(5.5, 3.2, 4.5);
    scene.add(sunLight);
    const fillLight = new THREE.DirectionalLight(0x7799ff, 0.55);
    fillLight.position.set(-4.5, 1.8, -3);
    scene.add(fillLight);

    // ===== EARTH =====
    const textureLoader = new THREE.TextureLoader();
    const earthTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg');
    earthTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

    const bumpTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_normal_2048.jpg');
    const cloudTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_clouds_1024.png');

    const earth = new THREE.Mesh(
      new THREE.SphereGeometry(1, 128, 128),
      new THREE.MeshStandardMaterial({
        map: earthTexture,
        bumpMap: bumpTexture,
        bumpScale: 0.05,
        roughness: 0.82,
        metalness: 0.04,
        emissive: new THREE.Color(0x0c0c1a),
        emissiveIntensity: 0.28
      })
    );
    scene.add(earth);

    const clouds = new THREE.Mesh(
      new THREE.SphereGeometry(1.01, 96, 96),
      new THREE.MeshStandardMaterial({
        map: cloudTexture,
        transparent: true,
        opacity: 0.34,
        depthWrite: false,
        roughness: 1
      })
    );
    earth.add(clouds);

    const atmosphere = new THREE.Mesh(
      new THREE.SphereGeometry(1.07, 64, 64),
      new THREE.ShaderMaterial({
        vertexShader: `
          varying vec3 vNormal;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vNormal;
          void main() {
            float intensity = pow(0.67 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.05);
            gl_FragColor = vec4(0.3, 0.58, 1.0, 1.0) * intensity * 1.1;
          }
        `,
        blending: THREE.AdditiveBlending,
        side: THREE.BackSide,
        transparent: true
      })
    );
    scene.add(atmosphere);

    // ==================== DATA ====================
    const points = [
      // CHÂU Á
      {
        name: "New Delhi, Ấn Độ",
        lat: 28.61, lon: 77.21, type: "red",
        problem: "Ô nhiễm không khí cực nghiêm trọng (AQI thường > 300) do đốt rơm rạ, giao thông và công nghiệp.",
        solution: "Cấm đốt rơm rạ, phát triển giao thông công cộng sạch, chuyển đổi năng lượng và giám sát chất lượng không khí thời gian thực."
      },
      {
        name: "Bắc Kinh, Trung Quốc",
        lat: 39.90, lon: 116.40, type: "red",
        problem: "Ô nhiễm bụi mịn PM2.5 cao kéo dài nhiều năm do than đá và giao thông.",
        solution: "Chuyển đổi sang năng lượng sạch, hạn chế xe dầu, xây dựng hệ thống giám sát và cảnh báo ô nhiễm."
      },
      {
        name: "Lahore, Pakistan",
        lat: 31.55, lon: 74.34, type: "red",
        problem: "Một trong những thành phố ô nhiễm nhất thế giới, khói bụi dày đặc quanh năm.",
        solution: "Kiểm soát khí thải công nghiệp, trồng cây xanh quy mô lớn và cải thiện hệ thống giao thông công cộng."
      },
      {
        name: "Jakarta, Indonesia",
        lat: -6.21, lon: 106.85, type: "orange",
        problem: "Ô nhiễm không khí và nước nghiêm trọng do giao thông + công nghiệp + nước thải.",
        solution: "Nâng cấp hệ thống xử lý nước thải, phát triển xe điện và kiểm soát khí thải nhà máy."
      },
      {
        name: "TP. Hồ Chí Minh",
        lat: 10.82, lon: 106.63, type: "orange",
        problem: "Ô nhiễm không khí và kênh rạch do giao thông + nước thải sinh hoạt & công nghiệp.",
        solution: "Triển khai xe buýt điện, xây nhà máy xử lý nước thải tập trung và cải tạo kênh rạch."
      },
      {
        name: "Hà Nội",
        lat: 21.03, lon: 105.85, type: "orange",
        problem: "Bụi mịn cao vào mùa đông, ảnh hưởng sức khỏe cộng đồng.",
        solution: "Kiểm soát khí thải công nghiệp, phát triển giao thông công cộng và tăng diện tích cây xanh."
      },
      {
        name: "Sông Hằng (Ấn Độ)",
        lat: 25.30, lon: 83.00, type: "red",
        problem: "Sông thiêng bị ô nhiễm nặng bởi nước thải, công nghiệp và rác thải.",
        solution: "Xây dựng hệ thống xử lý nước thải quy mô lớn, cấm xả thải trực tiếp và giáo dục cộng đồng."
      },
      {
        name: "Biển Đông – Rác nhựa",

        solution: "Giảm nhựa dùng một lần, tăng cường thu gom rác biển và hợp tác quốc tế về đại dương sạch."
      },
      {
        name: "Quần đảo Hoàng Sa",

        problem: "Thuộc chủ quyền Việt Nam. Chịu áp lực từ ô nhiễm nhựa, đánh bắt quá mức và suy thoái rạn san hô.",
        solution: "Bảo vệ hệ sinh thái biển, chống đánh bắt trái phép, kiểm soát ô nhiễm và phục hồi rạn san hô."
      },
      {
        name: "Quần đảo Trường Sa",
        lat: 10.00, lon: 114.20, type: "blue",
        problem: "Thuộc chủ quyền Việt Nam. Hệ sinh thái biển quan trọng đang bị đe dọa bởi ô nhiễm và khai thác quá mức.",
        solution: "Bảo tồn rạn san hô, kiểm soát ô nhiễm biển và thúc đẩy đánh bắt bền vững."
      },

      // CHÂU MỸ
      {
        name: "Amazon – Phá rừng",
        lat: -3.50, lon: -62.00, type: "orange",
        problem: "Mất rừng nghiêm trọng dẫn đến suy thoái đất, mất đa dạng sinh học và phát thải carbon lớn.",
        solution: "Bảo tồn rừng nguyên sinh, phục hồi rừng đã mất và phát triển kinh tế dựa trên lâm sản bền vững."
      },
      {
        name: "Los Angeles, Mỹ",
        lat: 34.05, lon: -118.24, type: "orange",
        problem: "Ô nhiễm không khí lịch sử do giao thông và công nghiệp (smog).",
        solution: "Tiêu chuẩn khí thải nghiêm ngặt, phát triển xe điện và năng lượng sạch – đã cải thiện rõ rệt qua nhiều thập kỷ."
      },
      {
        name: "Mexico City",
        lat: 19.43, lon: -99.13, type: "orange",
        problem: "Ô nhiễm không khí nghiêm trọng do địa hình thung lũng + giao thông đông đúc.",
        solution: "Hạn chế xe theo ngày, mở rộng metro và khuyến khích phương tiện sạch."
      },
      {
        name: "São Paulo, Brazil",
        lat: -23.55, lon: -46.63, type: "orange",
        problem: "Ô nhiễm không khí và nước đô thị lớn.",
        solution: "Mở rộng giao thông công cộng, xử lý nước thải và tăng cây xanh đô thị."
      },

      // CHÂU ÂU
      {
        name: "Luân Đôn (lịch sử smog)",
        lat: 51.51, lon: -0.13, type: "yellow",
        problem: "Từng chịu thảm họa sương khói năm 1952 do than đá.",
        solution: "Clean Air Act 1956 – chuyển sang nhiên liệu sạch, kiểm soát khí thải → trở thành hình mẫu kiểm soát ô nhiễm không khí."
      },
      {
        name: "Ba Lan – Than đá",
        lat: 52.10, lon: 19.40, type: "orange",
        problem: "Ô nhiễm không khí cao do phụ thuộc than đá để sưởi ấm và sản xuất điện.",
        solution: "Chuyển đổi dần sang năng lượng tái tạo, hỗ trợ hộ gia đình chuyển đổi nhiên liệu sạch."
      },

      // CHÂU PHI
      {
        name: "Cairo, Ai Cập",
        lat: 30.04, lon: 31.24, type: "orange",
        problem: "Ô nhiễm không khí và rác thải đô thị nghiêm trọng.",
        solution: "Cải thiện hệ thống thu gom rác, kiểm soát khí thải giao thông và phát triển năng lượng mặt trời."
      },
      {
        name: "Lagos, Nigeria",
        lat: 6.52, lon: 3.38, type: "orange",
        problem: "Ô nhiễm không khí + nước + rác thải do đô thị hóa nhanh.",
        solution: "Đầu tư hạ tầng xử lý nước thải, quản lý rác thải rắn và giao thông công cộng."
      },
      {
        name: "Johannesburg – Khai thác",
        lat: -26.20, lon: 28.04, type: "yellow",
        problem: "Ô nhiễm từ hoạt động khai thác mỏ và bụi công nghiệp.",
        solution: "Phục hồi môi trường sau khai thác, kiểm soát bụi và xử lý nước thải mỏ."
      },

      // CHÂU ĐẠI DƯƠNG
      {
        name: "Úc – Rạn san hô Great Barrier",
        lat: -18.00, lon: 147.00, type: "yellow",
        problem: "Rạn san hô lớn nhất thế giới bị tẩy trắng do biến đổi khí hậu và ô nhiễm nước.",
        solution: "Giảm phát thải, kiểm soát nông nghiệp chảy ra biển và phục hồi san hô."
      },

      // GIẢI PHÁP THÀNH CÔNG
      {
        name: "Costa Rica – Phục hồi rừng",
        lat: 9.75, lon: -83.75, type: "green",
        problem: "Từng mất rừng nghiêm trọng trong thế kỷ 20.",
        solution: "Chính sách chi trả dịch vụ hệ sinh thái + du lịch bền vững → phục hồi hơn 50% diện tích rừng."
      },
      {
        name: "Singapore – Quản lý nước",
        lat: 1.35, lon: 103.82, type: "green",
        problem: "Quốc đảo khan hiếm nước ngọt tự nhiên.",
        solution: "Công nghệ NEWater + thu gom nước mưa + quản lý thông minh → tự chủ gần như hoàn toàn nguồn nước."
      },
      {
        name: "Đan Mạch – Năng lượng gió",
        lat: 56.26, lon: 9.50, type: "green",
        problem: "Từng phụ thuộc nhiên liệu hóa thạch.",
        solution: "Đầu tư mạnh điện gió biển & đất liền. Mục tiêu 100% năng lượng tái tạo vào 2030."
      },
      {
        name: "Bhutan – Carbon âm",
        lat: 27.50, lon: 90.50, type: "green",
        problem: "Quốc gia nhỏ cần phát triển kinh tế nhưng muốn bảo vệ môi trường.",
        solution: "Bảo vệ rừng (>70% diện tích) + thủy điện sạch → trở thành quốc gia carbon âm."
      },
      {
        name: "Đức – Energiewende",
        lat: 51.16, lon: 10.45, type: "green",
        problem: "Phụ thuộc than đá và hạt nhân trong quá khứ.",
        solution: "Chương trình chuyển đổi năng lượng quốc gia – đẩy mạnh gió, mặt trời, giảm than."
      },
      {
        name: "Na Uy – Xe điện & thủy điện",
        lat: 60.47, lon: 8.47, type: "green",
        problem: "Cần giảm phát thải giao thông dù có dầu mỏ.",
        solution: "Gần 100% điện từ thủy điện + chính sách xe điện mạnh (hơn 80% xe mới là điện)."
      },
      {
        name: "Cà Mau – Rừng ngập mặn",
        lat: 9.15, lon: 105.15, type: "green",
        problem: "Bờ biển bị xói lở và ảnh hưởng biến đổi khí hậu.",
        solution: "Trồng & phục hồi rừng ngập mặn → chống biến đổi khí hậu, bảo vệ bờ biển, tạo sinh kế."
      },
      {
        name: "Ninh Thuận – Điện gió",
        lat: 11.60, lon: 108.90, type: "green",
        problem: "Cần tăng tỷ lệ năng lượng tái tạo.",
        solution: "Phát triển điện gió quy mô lớn → giảm phát thải, chuyển đổi năng lượng sạch."
      }
    ];

    function latLonToVec3(lat, lon, radius = 1.028) {
      const phi = (90 - lat) * Math.PI / 180;
      const theta = (lon + 180) * Math.PI / 180;
      return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
         radius * Math.cos(phi),
         radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    const markerGroup = new THREE.Group();
    earth.add(markerGroup);

    const markers = [];
    points.forEach((p) => {
      let color, size;
      if (p.type === "red")        { color = 0xff3b3b; size = 0.037; }
      else if (p.type === "orange"){ color = 0xff9f1a; size = 0.033; }
      else if (p.type === "yellow"){ color = 0xffd60a; size = 0.029; }
      else if (p.type === "blue")  { color = 0x00b4d8; size = 0.035; }
      else                        { color = 0x00e676; size = 0.036; }

      const marker = new THREE.Mesh(
        new THREE.SphereGeometry(size, 32, 32),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.96 })
      );
      marker.position.copy(latLonToVec3(p.lat, p.lon));
      marker.userData = p;

      const ring = new THREE.Mesh(
        new THREE.RingGeometry(size * 1.5, size * 2.05, 64),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.55, side: THREE.DoubleSide })
      );
      ring.lookAt(0, 0, 0);
      marker.add(ring);

      const glow = new THREE.Mesh(
        new THREE.SphereGeometry(size * 2.5, 32, 32),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.16, side: THREE.BackSide })
      );
      marker.add(glow);

      markerGroup.add(marker);
      markers.push(marker);
    });

    // ==================== INTERACTION + HIỆU ỨNG XOAY =====
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const popup = document.getElementById('popup');
    const popupTitle = document.getElementById('popup-title');
    const popupProblem = document.getElementById('popup-problem');
    const popupSolution = document.getElementById('popup-solution');

    function showPopup(x, y, data) {
      popupTitle.textContent = data.name;
      popupProblem.textContent = data.problem;
      popupSolution.innerHTML = "<strong>Giải pháp:</strong> " + data.solution;

      const colorMap = {
        red: "#ff3b3b",
        orange: "#ff9f1a",
        yellow: "#ffd60a",
        blue: "#00b4d8",
        green: "#00e676"
      };
      popup.style.borderColor = colorMap[data.type];
      popupTitle.style.color = colorMap[data.type];

      // Đặt vị trí
      popup.style.left = Math.min(x + 16, window.innerWidth - 360) + 'px';
      popup.style.top = Math.min(y + 16, window.innerHeight - 200) + 'px';

      // Hiện với hiệu ứng xoay
      popup.style.display = 'block';
      // Force reflow để transition chạy
      void popup.offsetWidth;
      popup.classList.add('show');
    }

    function hidePopup() {
      popup.classList.remove('show');
      // Đợi animation xong rồi mới ẩn hẳn
      setTimeout(() => {
        if (!popup.classList.contains('show')) {
          popup.style.display = 'none';
        }
      }, 400);
    }

    window.addEventListener('click', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(markers);

      if (hits.length > 0) {
        showPopup(e.clientX, e.clientY, hits[0].object.userData);
      } else {
        hidePopup();
      }
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      camera.position.set(0.3, 0.35, 3.0);
      controls.target.set(0, 0, 0);
      controls.update();
    });

    // ==================== ANIMATION ====================
    function animate() {
      requestAnimationFrame(animate);

      clouds.rotation.y -= 0.00012;

      const t = Date.now() * 0.002;
      markers.forEach((m, i) => {
        const s = 1 + Math.sin(t + i * 0.7) * 0.11;
        m.scale.setScalar(s);
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
